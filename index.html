<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xero Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="glow-dots"></div>

    <div class="app-container">
        
        <header class="profile-bar glass-panel">
            <div class="profile-left">
                <div class="avatar" id="user-avatar">👤</div>
                <div class="user-details">
                    <div class="user-name" id="user-name">xeroox</div>
                    <div class="user-tag" id="user-tag">@xeroox9</div>
                </div>
            </div>
            <div class="profile-stats">
                <span>⭐ 0</span>
                <span>⚡ 1</span>
                <span>✈️ 0</span>
            </div>
        </header>

        <main class="content-area">
            
            <div class="carousel-container" id="carousel">
                <div class="carousel-track" id="carousel-track">
                    
                    <!-- Баннер 1 -->
                    <div class="carousel-slide">
                        <img src="Sakyra1.png" class="slide-frame" alt="Сакура">
                        <div class="slide-inner">
                            <h2>Добро пожаловать</h2>
                            <p>Мир сакуры</p>
                        </div>
                        <img src="steve.png" class="banner-floating steve-float" alt="Steve">
                        <div class="petals-container" id="petals-1"></div>
                    </div>
                    
                    <!-- Баннер 2 -->
                    <div class="carousel-slide">
                        <img src="Sakyra2.png" class="slide-frame" alt="Лес">
                        <div class="slide-inner">
                            <h2>Ночной лес</h2>
                            <p>Тайны Minecraft</p>
                        </div>
                        <img src="steve2.png" class="banner-floating creeper-float" alt="Steve2">
                    </div>

                </div>
                
                <div class="carousel-dots" id="carousel-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                </div>
            </div>

            <div class="menu-list">
                
                <!-- Блок травы теперь main.png -->
                <button class="menu-card glass-panel" onclick="openPanel('ads')">
                    <div class="menu-info"><h3>Реклама</h3></div>
                    <img src="main.png" class="menu-png" alt="Реклама">
                </button>
                
                <button class="menu-card glass-panel" onclick="openPanel('private')">
                    <div class="menu-info"><h3>Приватка</h3></div>
                    <img src="steve.png" class="menu-png" alt="Приватка">
                </button>
                
                <button class="menu-card glass-panel" onclick="openPanel('profile')">
                    <div class="menu-info"><h3>Профиль</h3></div>
                    <img src="steve2.png" class="menu-png" alt="Профиль">
                </button>

                <button class="menu-card glass-panel" onclick="openPanel('support')">
                    <div class="menu-info"><h3>Поддержка</h3></div>
                    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" class="menu-png" alt="Поддержка">
                </button>

                <button class="menu-card glass-panel admin-only" id="admin-menu-btn" onclick="openPanel('admin')" style="display: none;">
                    <div class="menu-info"><h3>Админ-панель</h3></div>
                    <img src="https://cdn-icons-png.flaticon.com/512/2099/2099153.png" class="menu-png" alt="Админка">
                </button>

            </div>

        </main>

        <nav class="bottom-nav">
            <button class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">Главная</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">👤</span>
                <span class="nav-text">Профиль</span>
            </button>
            <button class="nav-item admin-only" id="admin-nav-tab" style="display: none;">
                <span class="nav-icon">⚙️</span>
                <span class="nav-text">Админка</span>
            </button>
        </nav>

    </div>

    <script src="app.js"></script>
</body>
</html>
