<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xero Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ЗАСТАВКА (Экран загрузки) -->
    <div id="splash-screen">
        <!-- Заменили ссылку на рабочего Стива -->
        <img src="https://i.ibb.co/3yq8R2V/steve.png" alt="Steve" class="splash-steve">
        <div class="splash-title">ЗАГРУЗКА...</div>
        <!-- Иконка Minecraft -->
        <img src="https://cdn-icons-png.flaticon.com/512/8209/8209804.png" alt="Minecraft" class="splash-mc-icon">
        
        <!-- Кнопка пропустить -->
        <button id="skip-btn" onclick="skipSplash()">Пропустить</button>
    </div>

    <!-- ФОН С БЛОКАМИ -->
    <div class="bg-animations" id="bg-animations"></div>

    <div class="app-container">
        
        <header class="profile-header glass-panel">
            <div class="profile-info">
                <div class="avatar" id="user-avatar">👤</div>
                <div class="user-details">
                    <div class="user-name" id="user-name">Загрузка...</div>
                    <div class="user-tag" id="user-tag">@username</div>
                </div>
            </div>
            <div class="stats-row">
                <div class="stat-item"><span>⭐</span> 0</div>
                <div class="stat-item"><span>🎟️</span> 0</div>
                <div class="stat-item"><span>🛒</span> 0</div>
            </div>
        </header>

        <main class="content-area" id="main-content">
            
            <!-- КАРУСЕЛЬ (Слайдер) -->
            <div class="carousel-container" id="carousel">
                <div class="carousel-track" id="carousel-track">
                    
                    <!-- Слайд 1: Сакура + Лепестки -->
                    <div class="carousel-slide">
                        <div class="slide-bg" style="background-image: url('https://i.ibb.co/3kR6R6Q/1.jpg');"></div>
                        <div class="slide-overlay"></div>
                        <div class="slide-content">
                            <h2>Сакура</h2>
                            <p>Уютный мир Minecraft</p>
                        </div>
                        <div class="petals-container" id="petals-1"></div>
                    </div>
                    
                    <!-- Слайд 2: Закат -->
                    <div class="carousel-slide">
                        <div class="slide-bg" style="background-image: url('https://i.ibb.co/6P8g1y2/2.jpg');"></div>
                        <div class="slide-overlay"></div>
                        <div class="slide-content">
                            <h2>Закат</h2>
                            <p>Невероятные виды</p>
                        </div>
                    </div>
                    
                    <!-- Слайд 3: Домик + Стив -->
                    <div class="carousel-slide">
                        <div class="slide-bg" style="background-image: url('https://i.ibb.co/KzK4xJ5/3.jpg');"></div>
                        <div class="slide-overlay"></div>
                        <div class="slide-content">
                            <h2>Твой дом</h2>
                            <p>Личный уголок</p>
                        </div>
                        <img src="https://i.ibb.co/8zPzQxH/steve.png" class="banner-steve" alt="Steve">
                    </div>

                </div>
                
                <!-- Точки (индикаторы) -->
                <div class="carousel-dots" id="carousel-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>

            <!-- КНОПКИ КАТЕГОРИЙ -->
            <div class="categories-grid">
                <button class="category-btn" onclick="openPanel('news')">
                    <div class="cat-img-container">
                        <img src="https://i.ibb.co/5Kq6Z9Z/4.jpg" alt="Новости">
                    </div>
                    <div class="cat-text">Новости</div>
                </button>
                
                <button class="category-btn" onclick="openPanel('private')">
                    <div class="cat-img-container">
                        <img src="https://i.ibb.co/7Qx3wW2/5.jpg" alt="Приватка">
                    </div>
                    <div class="cat-text">Приватка</div>
                </button>
                
                <button class="category-btn" onclick="openPanel('ads')">
                    <div class="cat-img-container">
                        <img src="https://i.ibb.co/4sYg8yH/6.jpg" alt="Реклама">
                    </div>
                    <div class="cat-text">Реклама</div>
                </button>
            </div>

        </main>

        <!-- НИЖНЯЯ НАВИГАЦИЯ -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('home')">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">Главная</span>
            </button>
            <button class="nav-item" onclick="switchTab('profile')">
                <span class="nav-icon">👤</span>
                <span class="nav-text">Профиль</span>
            </button>
            <button class="nav-item admin-only" id="admin-tab" onclick="switchTab('admin')" style="display: none;">
                <span class="nav-icon">⚙️</span>
                <span class="nav-text">Админка</span>
            </button>
        </nav>

    </div>

    <script src="app.js"></script>
</body>
</html>
