<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xero Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="petals-bg"></div>

    <div class="app-container">
        
        <!-- ТОНКИЙ ПРОФИЛЬ -->
        <header class="profile-bar glass-panel">
            <div class="profile-left">
                <div class="avatar" id="user-avatar">👤</div>
                <div class="user-details">
                    <div class="user-name" id="user-name">xeroox</div>
                    <div class="user-tag" id="user-tag">@xeroox9</div>
                </div>
            </div>
            <div class="profile-stats">
                <span>⭐ 0</span>
                <span>⚡ 1</span>
                <span>✈️ 0</span>
            </div>
        </header>

        <main class="content-area">
            
            <!-- БАННЕРЫ -->
            <div class="carousel-container" id="carousel">
                <div class="carousel-track" id="carousel-track">
                    
                    <div class="carousel-slide">
                        <img src="https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=1200&auto=format&fit=crop" class="slide-img" alt="Сакура">
                        <div class="slide-overlay"></div>
                        <!-- Парящий Стив в баннере -->
                        <img src="https://pngimg.com/uploads/minecraft/minecraft_PNG80.png" class="banner-floating steve-float" alt="Steve">
                        <div class="slide-content">
                            <h2>Добро пожаловать</h2>
                            <p>Мир сакуры</p>
                        </div>
                        <div class="petals-container" id="petals-1"></div>
                    </div>
                    
                    <div class="carousel-slide">
                        <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?q=80&w=1200&auto=format&fit=crop" class="slide-img" alt="Закат">
                        <div class="slide-overlay"></div>
                        <!-- Парящий Крипер в баннере -->
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Minecraft_Creeper.png/452px-Minecraft_Creeper.png" class="banner-floating creeper-float" alt="Creeper">
                        <div class="slide-content">
                            <h2>Закатный сад</h2>
                            <p>Уютные закаты</p>
                        </div>
                    </div>

                </div>
                
                <div class="carousel-dots" id="carousel-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                </div>
            </div>

            <!-- ТВОИ ПАНЕЛИ -->
            <div class="menu-list">
                
                <!-- Реклама -->
                <button class="menu-card glass-panel" onclick="openPanel('ads')">
                    <div class="menu-info">
                        <h3>Реклама</h3>
                    </div>
                    <img src="https://i.ibb.co/ZRNYK6JF/image.png" class="menu-png" alt="Реклама">
                </button>
                
                <!-- Приватка -->
                <button class="menu-card glass-panel" onclick="openPanel('private')">
                    <div class="menu-info">
                        <h3>Приватка</h3>
                    </div>
                    <img src="https://i.ibb.co/r9MchLk/image.png" class="menu-png" alt="Приватка">
                </button>
                
                <!-- Профиль -->
                <button class="menu-card glass-panel" onclick="openPanel('profile')">
                    <div class="menu-info">
                        <h3>Профиль</h3>
                    </div>
                    <img src="https://i.ibb.co/BVSwbPpR/image.png" class="menu-png" alt="Профиль">
                </button>

                <!-- Поддержка -->
                <button class="menu-card glass-panel" onclick="openPanel('support')">
                    <div class="menu-info">
                        <h3>Поддержка</h3>
                    </div>
                    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" class="menu-png" alt="Поддержка">
                </button>

                <!-- Админ-панель (скрыта для обычных юзеров) -->
                <button class="menu-card glass-panel admin-only" id="admin-menu-btn" onclick="openPanel('admin')" style="display: none;">
                    <div class="menu-info">
                        <h3>Админ-панель</h3>
                    </div>
                    <img src="https://cdn-icons-png.flaticon.com/512/2099/2099153.png" class="menu-png" alt="Админка">
                </button>

            </div>

        </main>

        <!-- НИЖНЯЯ НАВИГАЦИЯ -->
        <nav class="bottom-nav">
            <button class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">Главная</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">👤</span>
                <span class="nav-text">Профиль</span>
            </button>
            <button class="nav-item admin-only" id="admin-nav-tab" style="display: none;">
                <span class="nav-icon">⚙️</span>
                <span class="nav-text">Админка</span>
            </button>
        </nav>

    </div>

    <script src="app.js"></script>
</body>
</html>
