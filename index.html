<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xero Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Фон -->
    <div class="bg-animations" id="bg-animations"></div>

    <div class="app-container">
        
        <!-- ТОНКИЙ ПРОФИЛЬ (КАК НА РЕФЕРЕНСЕ) -->
        <header class="profile-bar">
            <div class="profile-left">
                <div class="avatar" id="user-avatar">👤</div>
                <div class="user-details">
                    <div class="user-name" id="user-name">xeroox</div>
                    <div class="user-tag" id="user-tag">@xeroox9</div>
                </div>
            </div>
            <div class="profile-stats">
                <span>⭐ 0</span>
                <span>⚡ 1</span>
                <span>✈️ 0</span>
            </div>
        </header>

        <main class="content-area">
            
            <!-- БАННЕРЫ (Карусель) -->
            <div class="carousel-container" id="carousel">
                <div class="carousel-track" id="carousel-track">
                    
                    <!-- Баннер 1 (Зеленый как на скрине) -->
                    <div class="carousel-slide">
                        <div class="slide-bg" style="background: linear-gradient(135deg, #0f3d1f, #1e7a35);"></div>
                        <div class="slide-content">
                            <h2>РОЗЫГРЫШ 1000$</h2>
                            <p>ДОБАВЬ БОТА К СЕБЕ В ЧАТ</p>
                            <button class="slide-btn">создать клан →</button>
                        </div>
                    </div>
                    
                    <!-- Баннер 2 (Темный) -->
                    <div class="carousel-slide">
                        <div class="slide-bg" style="background: linear-gradient(135deg, #2b0b0b, #6b1c1c);"></div>
                        <div class="slide-content">
                            <h2>ШКОЛА РОМАНТИКИ</h2>
                            <p>ИГРА ОТ ШГШ</p>
                        </div>
                    </div>

                </div>
                <div class="carousel-dots" id="carousel-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                </div>
            </div>

            <!-- ДЛИННЫЕ КНОПКИ-МЕНЮ -->
            <div class="menu-list">
                
                <!-- Магазин (Желтый) -->
                <button class="menu-card" style="background: linear-gradient(135deg, #e6b800, #ffcc00);">
                    <div class="menu-info">
                        <span class="menu-tag">НОВОЕ</span>
                        <h3>Магазин</h3>
                    </div>
                    <img src="https://cdn-icons-png.flaticon.com/512/3514/3514491.png" class="menu-png" alt="Магазин">
                </button>
                
                <!-- НФТ актеры (Фиолетовый) -->
                <button class="menu-card" style="background: linear-gradient(135deg, #6a1b9a, #ab47bc);">
                    <div class="menu-info">
                        <span class="menu-tag">ПОПУЛЯРНОЕ</span>
                        <h3>НФТ актёры</h3>
                    </div>
                    <img src="https://cdn-icons-png.flaticon.com/512/2921/2921222.png" class="menu-png" alt="НФТ">
                </button>
                
                <!-- Рейтинг (Синий) -->
                <button class="menu-card" style="background: linear-gradient(135deg, #1565c0, #42a5f5);">
                    <div class="menu-info">
                        <span class="menu-tag">ТОПЫ И ПРИЗЫ</span>
                        <h3>Рейтинг</h3>
                    </div>
                    <img src="https://cdn-icons-png.flaticon.com/512/2583/2583344.png" class="menu-png" alt="Рейтинг">
                </button>

            </div>

        </main>

        <!-- НИЖНЯЯ НАВИГАЦИЯ -->
        <nav class="bottom-nav">
            <button class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">Главная</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">🏆</span>
                <span class="nav-text">Рейтинг</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">🎫</span>
                <span class="nav-text">Лотерея</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">✨</span>
                <span class="nav-text">НФТ</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">👤</span>
                <span class="nav-text">Профиль</span>
            </button>
        </nav>

    </div>

    <script src="app.js"></script>
</body>
</html>
