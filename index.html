<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xero Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем пиксельный шрифт Minecraft -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Космический фон с декором -->
    <div class="space-bg">
        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>
        <div class="decor-layer" id="bg-decor"></div>
    </div>

    <div class="app-container">
        
        <!-- Профиль (с кнопкой Пополнить) -->
        <header class="profile-bar glass-panel">
            <div class="profile-left">
                <div class="avatar" id="user-avatar">👤</div>
                <div class="user-details">
                    <div class="user-name" id="user-name">xeroox</div>
                    <div class="user-tag" id="user-tag">@xeroox9</div>
                </div>
            </div>
            <button class="topup-btn">Пополнить +</button>
        </header>

        <main class="content-area">
            
            <!-- БАННЕРЫ -->
            <div class="carousel-container" id="carousel">
                <div class="carousel-track" id="carousel-track">
                    
                    <!-- Баннер 1: TGK -->
                    <div class="carousel-slide">
                        <img src="Sakyra1.png" class="slide-img" alt="Сакура">
                        <div class="slide-overlay"></div>
                        <div class="decor-layer" id="banner-decor-1"></div>
                        
                        <div class="slide-content">
                            <div class="capsule">
                                <span class="mc-text">Официальный Telegram канал</span>
                            </div>
                            <p class="sub-text">tgk xeroox news</p>
                        </div>
                    </div>
                    
                    <!-- Баннер 2: Never Time -->
                    <div class="carousel-slide">
                        <img src="Sakyra2.png" class="slide-img" alt="Лес">
                        <div class="slide-overlay"></div>
                        <div class="decor-layer" id="banner-decor-2"></div>

                        <div class="slide-content">
                            <div class="capsule">
                                <span class="mc-text">Never Time</span>
                            </div>
                            <p class="sub-text">ip: mc.nevertime.su</p>
                            <p class="sub-text-small">Лучший сервер</p>
                        </div>
                    </div>

                </div>
                
                <div class="carousel-dots" id="carousel-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                </div>
            </div>

            <!-- ПАНЕЛИ (с увеличенным отступом) -->
            <div class="menu-list">
                
                <button class="menu-card glass-panel" onclick="openPanel('ads')">
                    <div class="menu-info"><h3>Заказать рекламу</h3></div>
                    <img src="main.png" class="menu-png" alt="Реклама">
                </button>
                
                <button class="menu-card glass-panel" onclick="openPanel('private')">
                    <div class="menu-info"><h3>Приватные аккаунты</h3></div>
                    <img src="steve.png" class="menu-png" alt="Приватка">
                </button>
                
                <button class="menu-card glass-panel" onclick="openPanel('profile')">
                    <div class="menu-info"><h3>Мой профиль</h3></div>
                    <img src="steve2.png" class="menu-png" alt="Профиль">
                </button>

                <button class="menu-card glass-panel" onclick="openPanel('support')">
                    <div class="menu-info"><h3>Поддержка 24/7</h3></div>
                    <img src="steve3.png" class="menu-png" alt="Поддержка">
                </button>

                <button class="menu-card glass-panel admin-only" id="admin-menu-btn" onclick="openPanel('admin')" style="display: none;">
                    <div class="menu-info"><h3>Админ-панель</h3></div>
                    <img src="icon.png" class="menu-png" alt="Админка">
                </button>

            </div>

        </main>

        <nav class="bottom-nav">
            <button class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">Главная</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">👤</span>
                <span class="nav-text">Профиль</span>
            </button>
            <button class="nav-item admin-only" id="admin-nav-tab" style="display: none;">
                <span class="nav-icon">⚙️</span>
                <span class="nav-text">Админка</span>
            </button>
        </nav>

    </div>

    <script src="app.js"></script>
</body>
</html>
