<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xero Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ФОН ДЛЯ ЛЕПЕСТКОВ -->
    <div id="petals-bg"></div>

    <div class="app-container">
        
        <!-- ТОНКИЙ ПРОФИЛЬ -->
        <header class="profile-bar">
            <div class="profile-left">
                <div class="avatar" id="user-avatar">👤</div>
                <div class="user-details">
                    <div class="user-name" id="user-name">xeroox</div>
                    <div class="user-tag" id="user-tag">@xeroox9</div>
                </div>
            </div>
            <div class="profile-stats">
                <span>⭐ 0</span>
                <span>⚡ 1</span>
                <span>✈️ 0</span>
            </div>
        </header>

        <main class="content-area">
            
            <!-- БАННЕРЫ -->
            <div class="carousel-container" id="carousel">
                <div class="carousel-track" id="carousel-track">
                    
                    <!-- Слайд 1: Твоя рамка с сакурой (с лепестками) -->
                    <div class="carousel-slide">
                        <img src="https://i.ibb.co/ynYDmPWG/image.jpg" class="slide-img" alt="Сакура">
                        <div class="slide-overlay"></div>
                        <div class="slide-content">
                            <h2>Добро пожаловать</h2>
                            <p>Мир сакуры</p>
                        </div>
                        <div class="petals-container" id="petals-1"></div>
                    </div>
                    
                    <!-- Слайд 2: Закатный сад -->
                    <div class="carousel-slide">
                        <img src="https://i.ibb.co/TDGJ6whb/image.jpg" class="slide-img" alt="Закат">
                        <div class="slide-overlay"></div>
                        <div class="slide-content">
                            <h2>Закатный сад</h2>
                            <p>Уютные закаты</p>
                        </div>
                    </div>

                </div>
                
                <div class="carousel-dots" id="carousel-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                </div>
            </div>

            <!-- ПАНЕЛИ -->
            <div class="menu-list">
                
                <!-- Панель 1: Магазин -->
                <button class="menu-card" style="background: linear-gradient(135deg, #4a00e0, #8e2de2);">
                    <div class="menu-info">
                        <span class="menu-tag">НОВОЕ</span>
                        <h3>Магазин</h3>
                    </div>
                    <!-- Твой Стив с поднятыми руками -->
                    <img src="https://i.ibb.co/r9MchLk/image.png" class="menu-png" alt="Стив">
                </button>
                
                <!-- Панель 2: НФТ актеры -->
                <button class="menu-card" style="background: linear-gradient(135deg, #ff0844, #ffb199);">
                    <div class="menu-info">
                        <span class="menu-tag">ПОПУЛЯРНОЕ</span>
                        <h3>НФТ актёры</h3>
                    </div>
                    <!-- Блок травы -->
                    <img src="https://i.ibb.co/ZRNYK6JF/image.png" class="menu-png" alt="Блок">
                </button>
                
                <!-- Панель 3: Рейтинг -->
                <button class="menu-card" style="background: linear-gradient(135deg, #00c6ff, #0072ff);">
                    <div class="menu-info">
                        <span class="menu-tag">ТОПЫ И ПРИЗЫ</span>
                        <h3>Рейтинг</h3>
                    </div>
                    <!-- Второй Стив -->
                    <img src="https://i.ibb.co/BVSwbPpR/image.png" class="menu-png" alt="Стив">
                </button>

            </div>

        </main>

        <!-- НИЖНЯЯ НАВИГАЦИЯ -->
        <nav class="bottom-nav">
            <button class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">Главная</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">🏆</span>
                <span class="nav-text">Рейтинг</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">🎫</span>
                <span class="nav-text">Лотерея</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">✨</span>
                <span class="nav-text">НФТ</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">👤</span>
                <span class="nav-text">Профиль</span>
            </button>
        </nav>

    </div>

    <script src="app.js"></script>
</body>
</html>
