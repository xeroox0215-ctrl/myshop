<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xero Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-animations" id="bg-animations"></div>

    <div class="app-container">
        
        <!-- ТОНКАЯ ПАНЕЛЬ ПРОФИЛЯ -->
        <header class="profile-bar glass-panel">
            <div class="avatar" id="user-avatar">👤</div>
            <div class="user-details">
                <div class="user-name" id="user-name">Загрузка...</div>
                <div class="user-tag" id="user-tag">@username</div>
            </div>
        </header>

        <main class="content-area" id="main-content">
            
            <!-- КАРУСЕЛЬ -->
            <div class="carousel-container" id="carousel">
                <div class="carousel-track" id="carousel-track">
                    
                    <!-- Слайд 1: Сакура -->
                    <div class="carousel-slide">
                        <div class="slide-bg" style="background-image: url('https://images.unsplash.com/photo-1518509562904-e7ef99cdcc86?q=80&w=800&auto=format&fit=crop');"></div>
                        <div class="slide-overlay"></div>
                        <div class="slide-content">
                            <h2>Сакура</h2>
                            <p>Уютный мир</p>
                        </div>
                        <div class="petals-container" id="petals-1"></div>
                    </div>
                    
                    <!-- Слайд 2: Закат -->
                    <div class="carousel-slide">
                        <div class="slide-bg" style="background-image: url('https://images.unsplash.com/photo-1472214103451-9374bd1c798e?q=80&w=800&auto=format&fit=crop');"></div>
                        <div class="slide-overlay"></div>
                        <div class="slide-content">
                            <h2>Закат</h2>
                            <p>Красивые виды</p>
                        </div>
                    </div>
                    
                    <!-- Слайд 3: Домик + Крипер -->
                    <div class="carousel-slide">
                        <div class="slide-bg" style="background-image: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=800&auto=format&fit=crop');"></div>
                        <div class="slide-overlay"></div>
                        <div class="slide-content">
                            <h2>Твой дом</h2>
                            <p>Личный уголок</p>
                        </div>
                        <!-- Красивый 3D Крипер PNG без фона -->
                        <img src="https://cdn.cloudflare.steamstatic.com/steamcommunity/public/images/avatars/2d/2d4a4244230323870c7d74dc3936638a29c6a4e0_full.jpg" class="banner-png" alt="Creeper" style="mix-blend-mode: screen; border-radius: 20px;">
                    </div>

                </div>
                
                <div class="carousel-dots" id="carousel-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>

            <!-- КНОПКИ КАТЕГОРИЙ -->
            <div class="categories-grid">
                <button class="category-btn" onclick="openPanel('news')">
                    <div class="cat-img-container">
                        <!-- 3D Иконка Новостей -->
                        <img src="https://cdn-icons-png.flaticon.com/512/2965/2965879.png" alt="Новости">
                    </div>
                    <div class="cat-text">Новости</div>
                </button>
                
                <button class="category-btn" onclick="openPanel('private')">
                    <div class="cat-img-container">
                        <!-- 3D Иконка Замка -->
                        <img src="https://cdn-icons-png.flaticon.com/512/2889/2889676.png" alt="Приватка">
                    </div>
                    <div class="cat-text">Приватка</div>
                </button>
                
                <button class="category-btn" onclick="openPanel('ads')">
                    <div class="cat-img-container">
                        <!-- 3D Иконка Рекламы -->
                        <img src="https://cdn-icons-png.flaticon.com/512/3154/3154315.png" alt="Реклама">
                    </div>
                    <div class="cat-text">Реклама</div>
                </button>
            </div>

        </main>

        <!-- НИЖНЯЯ НАВИГАЦИЯ -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('home')">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">Главная</span>
            </button>
            <button class="nav-item" onclick="switchTab('profile')">
                <span class="nav-icon">👤</span>
                <span class="nav-text">Профиль</span>
            </button>
            <button class="nav-item admin-only" id="admin-tab" onclick="switchTab('admin')" style="display: none;">
                <span class="nav-icon">⚙️</span>
                <span class="nav-text">Админка</span>
            </button>
        </nav>

    </div>

    <script src="app.js"></script>
</body>
</html>
