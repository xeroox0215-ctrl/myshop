<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xero Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Светящиеся пятна для "живого" фона -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div id="petals-bg"></div>

    <div class="app-container">
        
        <header class="profile-bar glass-panel">
            <div class="profile-left">
                <div class="avatar" id="user-avatar">👤</div>
                <div class="user-details">
                    <div class="user-name" id="user-name">xeroox</div>
                    <div class="user-tag" id="user-tag">@xeroox9</div>
                </div>
            </div>
            <div class="profile-stats">
                <span>⭐ 0</span>
                <span>⚡ 1</span>
                <span>✈️ 0</span>
            </div>
        </header>

        <main class="content-area">
            
            <div class="carousel-container" id="carousel">
                <div class="carousel-track" id="carousel-track">
                    
                    <!-- Слайд 1 -->
                    <div class="carousel-slide">
                        <img src="https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=1200&auto=format&fit=crop" class="slide-img" alt="Сакура">
                        <div class="slide-overlay"></div>
                        <!-- Рабочий Стив -->
                        <img src="https://i.postimg.cc/5N1Y6R8x/steve.png" class="banner-floating steve-float" alt="Steve">
                        <div class="slide-content">
                            <h2>Добро пожаловать</h2>
                            <p>Мир сакуры</p>
                        </div>
                        <div class="petals-container" id="petals-1"></div>
                    </div>
                    
                    <!-- Слайд 2 -->
                    <div class="carousel-slide">
                        <img src="https://images.unsplash.com/photo-1511497584788-876760111969?q=80&w=1200&auto=format&fit=crop" class="slide-img" alt="Лес">
                        <div class="slide-overlay"></div>
                        <!-- Рабочий Крипер -->
                        <img src="https://i.postimg.cc/x8XyD8sD/creeper.png" class="banner-floating creeper-float" alt="Creeper">
                        <div class="slide-content">
                            <h2>Ночной лес</h2>
                            <p>Тайны Minecraft</p>
                        </div>
                    </div>

                </div>
                
                <div class="carousel-dots" id="carousel-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                </div>
            </div>

            <div class="menu-list">
                
                <button class="menu-card glass-panel" onclick="openPanel('ads')">
                    <div class="menu-info"><h3>Реклама</h3></div>
                    <!-- Рабочий Блок Травы -->
                    <img src="https://i.postimg.cc/1zF1Y6Q2/grass.png" class="menu-png" alt="Реклама">
                </button>
                
                <button class="menu-card glass-panel" onclick="openPanel('private')">
                    <div class="menu-info"><h3>Приватка</h3></div>
                    <img src="https://i.postimg.cc/5N1Y6R8x/steve.png" class="menu-png" alt="Приватка">
                </button>
                
                <button class="menu-card glass-panel" onclick="openPanel('profile')">
                    <div class="menu-info"><h3>Профиль</h3></div>
                    <img src="https://i.postimg.cc/x8XyD8sD/creeper.png" class="menu-png" alt="Профиль">
                </button>

                <button class="menu-card glass-panel" onclick="openPanel('support')">
                    <div class="menu-info"><h3>Поддержка</h3></div>
                    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" class="menu-png" alt="Поддержка">
                </button>

                <button class="menu-card glass-panel admin-only" id="admin-menu-btn" onclick="openPanel('admin')" style="display: none;">
                    <div class="menu-info"><h3>Админ-панель</h3></div>
                    <img src="https://cdn-icons-png.flaticon.com/512/2099/2099153.png" class="menu-png" alt="Админка">
                </button>

            </div>

        </main>

        <nav class="bottom-nav">
            <button class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">Главная</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">👤</span>
                <span class="nav-text">Профиль</span>
            </button>
            <button class="nav-item admin-only" id="admin-nav-tab" style="display: none;">
                <span class="nav-icon">⚙️</span>
                <span class="nav-text">Админка</span>
            </button>
        </nav>

    </div>

    <script src="app.js"></script>
</body>
</html>
